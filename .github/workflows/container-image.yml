# Reusable multi-architecture container image build — aret-infra#1.
# Builds natively on GitHub's x86 (amd64) and ARM (arm64) runners, free for public repos,
# instead of slow emulation. With `push: true`, pushes one multi-arch image to
# ghcr.io/<owner>/<image> tagged `sha-<commit>` and, on the default branch, `latest`.
# Without push, it only checks that the image builds (use on pull requests).
#
# Use from another repo (the calling workflow must grant `packages: write` to push):
#   jobs:
#     image:
#       uses: aret-app/aret-infra/.github/workflows/container-image.yml@main
#       with:
#         image: aret-tracks
#         build-args: SERVICE=aret-tracks
#         push: ${{ github.event_name == 'push' }}

name: Container image

on:
  workflow_call:
    inputs:
      image:
        description: Image name under ghcr.io/<owner>/ (e.g. aret-tracks)
        required: true
        type: string
      build-args:
        description: Newline-separated build arguments (e.g. SERVICE=aret-tracks)
        required: false
        type: string
        default: ""
      context:
        description: Build context directory
        required: false
        type: string
        default: "."
      push:
        description: Push to GHCR (true on main) or only build (pull requests)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build${{ inputs.push && ' and push by digest' || '' }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          platforms: linux/${{ matrix.arch }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha,scope=${{ inputs.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}-${{ matrix.arch }}
          outputs: ${{ inputs.push && format('type=image,name=ghcr.io/{0}/{1},push-by-digest=true,name-canonical=true,push=true', github.repository_owner, inputs.image) || 'type=cacheonly' }}

      - name: Save digest
        if: inputs.push
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        if: inputs.push
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ inputs.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish multi-arch image
    if: inputs.push
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create multi-arch image
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Show image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
